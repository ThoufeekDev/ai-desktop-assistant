
[project]
name = "friday"
version = "0.1.0"
description = "A local-first desktop AI assistant for Linux"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
friday = "friday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]
