
[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first desktop AI assistant for Linux"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"
friday = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
